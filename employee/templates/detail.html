{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container w-75 m-auto">


<h2>Details View</h2>
{{users}}

    <div class="card mb-3" style="max-width: 80%;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ users.image.url }}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">Employee Details</h5>
        <p class="card-text"> Empid : {{users.empid}}</p>
          <p class="card-text">Name : {{users.name}}</p>
          <p class="card-text">Deptname : {{users.deptname}}</p>
          <p class="card-text">Salary : {{users.salary}}</p>
          <p class="card-text">Designation : {{users.designations}}</p>

      </div>
    </div>
  </div>
</div>



</div>

{% endblock %}
