{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-3 p-5 w-50 text-center">
    <h2>Add new employee</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}

        <button class="btn btn-primary mt-5" type="submit">Submit</button>
    </form>
</div>


{% endblock %}
