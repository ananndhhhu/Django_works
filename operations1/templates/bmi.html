{% extends 'base.html' %}


{% block content %}


<div class="container mt-3 p-5 w-50 text-center">
<h2>BMI</h2>

    <form method="POST" >
        {% csrf_token %}
<input class="form-control"  type="number" name="n1" placeholder="Enter Weight">
    <input class="form-control mt-5"  type="number" name="n2" placeholder="Enter Height">

    <button class="btn btn-primary mt-5" type="submit">Submit</button>

    <h3 class="sum mt-5">Bmi is : {{bmi}}</h3>

        </form>
    </div>

{% endblock %}
