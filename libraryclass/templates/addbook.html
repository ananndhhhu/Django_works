{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h1>Add Book</h1>

<div class="container mt-3 p-5 w-50 text-center">
    <h2>Add Books</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}

        <button class="btn btn-primary mt-5" type="submit">Submit</button>
    </form>
</div>


{% endblock %}
